# Serverless Devs profile for Aliyun Function Compute 3.0.
#
#   npm i -g @serverless-devs/s
#   s config add           # store your Aliyun AccessKey as the "default" access
#   s deploy               # create/update the function and HTTP trigger
#
# The handler is `fc/index.handler`: FC loads the code root below and requires
# fc/index.js (CommonJS) which dynamically imports the shared ESM core.
#
# Do not commit real secrets here. Either keep them commented out and set them
# in the FC console, or use a RAM role and the STS token support in the OSS
# adapter.
edition: 3.0.0
name: shortlink
access: default

vars:
  region: cn-hangzhou

resources:
  shortlink:
    component: fc3
    props:
      region: ${vars.region}
      functionName: shortlink
      description: Short link service (same core as the Cloudflare Pages deployment)
      runtime: nodejs20
      code: ./
      handler: fc/index.handler
      memorySize: 128
      timeout: 60
      instanceConcurrency: 20
      environmentVariables:
        STORAGE: oss
        PAGE_TITLE: ShortLink
        CORS_MODE: open
        RL_WINDOW_SEC: "60"
        RL_MAX_REQ: "10"
        # BASE_URL: https://s.example.com
        # OSS_BUCKET: your-bucket
        # OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
        # OSS_PREFIX: shortlink/
        # OSS_ACCESS_KEY_ID: ""
        # OSS_ACCESS_KEY_SECRET: ""
        # CREATE_TOKEN: ""
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - HEAD
              - OPTIONS
