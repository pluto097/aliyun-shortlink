name = "shortlink"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# ---------------------------------------------------------------------------
# Cloudflare KV binding (required unless you pick another STORAGE backend).
#
#   npx wrangler kv namespace create LINKS
#
# Paste the returned id here and uncomment:
#
# [[kv_namespaces]]
# binding = "LINKS"
# id = "0123456789abcdef0123456789abcdef"
# ---------------------------------------------------------------------------

# Non-secret configuration. Secrets (CREATE_TOKEN, OSS_ACCESS_KEY_SECRET, ...)
# belong in the dashboard or in `wrangler pages secret put`.
[vars]
# BASE_URL = "https://s.example.com"
# PAGE_TITLE = "ShortLink"
# PAGE_ICON = "🔗"
# CORS_MODE = "open"
# RL_WINDOW_SEC = "60"
# RL_MAX_REQ = "10"
# DEDUP_TTL_SEC = "0"
